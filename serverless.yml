service: trip-planner-api
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    TABLE_NAME: trip-planner-${self:provider.stage}
    COGNITO_USER_POOL_ID: !Ref TripPlannerUserPool
    COGNITO_CLIENT_ID: !Ref TripPlannerUserPoolClient
    # Widens shared/auth.js's defense-in-depth JWT re-check to accept tokens
    # from either app client. Which *route* a token can reach is still
    # controlled separately, by which HTTP API authorizer (cognitoJwt vs
    # cognitoJwtMcp) each route references — this only affects the re-check.
    COGNITO_ALLOWED_CLIENT_IDS: !Join [',', [!Ref TripPlannerUserPoolClient, !Ref TripPlannerMcpClient]]
    WEATHER_SECRET_NAME: trip-planner/weather-api-key
    # Email (SES) — all optional until SES setup is complete. shared/ses.js
    # safely no-ops (logs instead of sending) while SES_FROM_EMAIL or
    # SES_MAILING_ADDRESS is unset — neither exists until a sending identity
    # is verified in SES and AWS approves a production-access request, both
    # manual steps only doable from the AWS console (see README). Set these
    # in a local .env (useDotenv above) once that's done.
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, ''}
    SES_MAILING_ADDRESS: ${env:SES_MAILING_ADDRESS, ''}
    UNSUBSCRIBE_SECRET: ${env:UNSUBSCRIBE_SECRET, ''}
    APP_BASE_URL: ${env:APP_BASE_URL, ''}
    API_BASE_URL: ${env:API_BASE_URL, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt TripPlannerTable.Arn
            - !Sub '${TripPlannerTable.Arn}/index/*'
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          # Scoped to the two models actually called (shared/bedrock.js
          # MODEL_IDS) instead of every foundation model in every region for
          # any account — if MODEL_IDS changes, this list needs to change
          # with it. Both models are invoked via "us."-prefixed cross-region
          # inference profiles, which need permission on the profile
          # resource itself *and* on the underlying foundation model in each
          # region the profile may route to (us-east-1/us-east-2/us-west-2,
          # per AWS's documented span for Claude's "us." profiles) — Bedrock
          # checks both regardless of which region actually serves the call.
          Resource:
            - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
            - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0'
            - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6'
            - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6'
            - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6'
            - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
            - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
            - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:trip-planner/weather-api-key-*'
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          # No verified sending identity exists yet (see SES_FROM_EMAIL
          # above), so this can't be scoped to a specific identity ARN until
          # one is verified — tighten this to that identity's ARN once SES
          # setup is done; '*' is a temporary stand-in, not the end state.
          Resource: '*'
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
          Resource:
            - !GetAtt TripPlannerUserPool.Arn
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            # Built as a string, not !GetAtt GenerateWorkerLambdaFunction.Arn —
            # that created a circular dependency: this statement lives on the
            # shared IamRoleLambdaExecution role that every function
            # (including generateWorker itself) uses as its execution role,
            # so a direct resource reference here means the role needs the
            # function and the function needs the role. Only pseudo-params
            # here (AWS::Region/AccountId), no dependency edge to break.
            - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:trip-planner-api-${self:provider.stage}-generateWorker'
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - https://trip-planner-manifest.web.app
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${TripPlannerUserPool}'
        audience:
          - !Ref TripPlannerUserPoolClient
      # Deliberately separate from cognitoJwt, scoped to only the MCP app
      # client's audience — a token minted for MCP can authorize /mcp but
      # can never satisfy cognitoJwt on the raw REST routes, even though the
      # mcp Lambda itself has equivalent access to the same user's data.
      cognitoJwtMcp:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${TripPlannerUserPool}'
        audience:
          - !Ref TripPlannerMcpClient

functions:
  createTrip:
    handler: functions/trips/create.handler
    events:
      - httpApi:
          path: /trips
          method: post
          authorizer:
            name: cognitoJwt

  listTrips:
    handler: functions/trips/list.handler
    events:
      - httpApi:
          path: /trips
          method: get
          authorizer:
            name: cognitoJwt

  getTrip:
    handler: functions/trips/get.handler
    events:
      - httpApi:
          path: /trips/{tripId}
          method: get
          authorizer:
            name: cognitoJwt

  updateTrip:
    handler: functions/trips/update.handler
    events:
      - httpApi:
          path: /trips/{tripId}
          method: put
          authorizer:
            name: cognitoJwt

  getTripToday:
    handler: functions/trips/today.handler
    events:
      - httpApi:
          path: /trips/{tripId}/today
          method: get
          authorizer:
            name: cognitoJwt

  previewTrip:
    handler: functions/trips/preview.handler
    events:
      - httpApi:
          path: /trips/{tripId}/preview
          method: get
          authorizer:
            name: cognitoJwt

  joinTrip:
    handler: functions/trips/join.handler
    events:
      - httpApi:
          path: /trips/{tripId}/join
          method: post
          authorizer:
            name: cognitoJwt

  updateMyMembership:
    handler: functions/members/updateMe.handler
    events:
      - httpApi:
          path: /trips/{tripId}/members/me
          method: patch
          authorizer:
            name: cognitoJwt

  upsertMyLogistics:
    handler: functions/logistics/upsert.handler
    events:
      - httpApi:
          path: /trips/{tripId}/logistics/me
          method: put
          authorizer:
            name: cognitoJwt

  createBooking:
    handler: functions/bookings/create.handler
    events:
      - httpApi:
          path: /trips/{tripId}/bookings
          method: post
          authorizer:
            name: cognitoJwt

  updateBooking:
    handler: functions/bookings/update.handler
    events:
      - httpApi:
          path: /trips/{tripId}/bookings/{bookingId}
          method: put
          authorizer:
            name: cognitoJwt

  removeBooking:
    handler: functions/bookings/remove.handler
    events:
      - httpApi:
          path: /trips/{tripId}/bookings/{bookingId}
          method: delete
          authorizer:
            name: cognitoJwt

  createExpense:
    handler: functions/expenses/create.handler
    events:
      - httpApi:
          path: /trips/{tripId}/expenses
          method: post
          authorizer:
            name: cognitoJwt

  removeExpense:
    handler: functions/expenses/remove.handler
    events:
      - httpApi:
          path: /trips/{tripId}/expenses/{expenseId}
          method: delete
          authorizer:
            name: cognitoJwt

  generateAdvisorTips:
    handler: functions/advisor/generate.handler
    timeout: 15
    events:
      - httpApi:
          path: /trips/{tripId}/advisor/generate
          method: post
          authorizer:
            name: cognitoJwt

  dismissAdvisorTip:
    handler: functions/advisor/dismiss.handler
    events:
      - httpApi:
          path: /trips/{tripId}/advisor/{tipId}
          method: delete
          authorizer:
            name: cognitoJwt

  getWeather:
    handler: functions/weather/get.handler
    timeout: 10
    events:
      - httpApi:
          path: /trips/{tripId}/weather
          method: get
          authorizer:
            name: cognitoJwt

  generatePlan:
    handler: functions/plan/generate.handler
    timeout: 10
    environment:
      GENERATE_WORKER_FUNCTION_NAME: !Ref GenerateWorkerLambdaFunction
    events:
      - httpApi:
          path: /trips/{tripId}/plan/generate
          method: post
          authorizer:
            name: cognitoJwt

  # No httpApi event — invoked directly (async) by generatePlan, not through API
  # Gateway, so it isn't bound by HTTP API's hard 29s synchronous-integration ceiling.
  generateWorker:
    handler: functions/plan/generateWorker.handler
    # Raised alongside maxTokens (3000 -> 8000): worst-case generation speed
    # could otherwise approach or exceed 90s for a full 8000-token response.
    # Raised again (180 -> 240) after adding sequential Overpass lookups
    # (shared/overpass.js) — up to 5 locations, each observed taking as long
    # as ~9s on the live public instance, adds a real ~50s worst case on top.
    # No API Gateway ceiling applies here (invoked async), so there's no
    # reason to be tight — Lambda supports up to 900s.
    timeout: 240

  markEventDone:
    handler: functions/events/markDone.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/done
          method: put
          authorizer:
            name: cognitoJwt

  unmarkEventDone:
    handler: functions/events/unmarkDone.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/done
          method: delete
          authorizer:
            name: cognitoJwt

  pickEventOption:
    handler: functions/events/pick.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/pick
          method: put
          authorizer:
            name: cognitoJwt

  unpickEventOption:
    handler: functions/events/unpick.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/pick
          method: delete
          authorizer:
            name: cognitoJwt

  createSuggestion:
    handler: functions/suggestions/create.handler
    events:
      - httpApi:
          path: /trips/{tripId}/suggestions
          method: post
          authorizer:
            name: cognitoJwt

  removeSuggestion:
    handler: functions/suggestions/remove.handler
    events:
      - httpApi:
          path: /trips/{tripId}/suggestions/{suggestionId}
          method: delete
          authorizer:
            name: cognitoJwt

  upsertMyApproval:
    handler: functions/approvals/upsert.handler
    events:
      - httpApi:
          path: /trips/{tripId}/approvals/me
          method: put
          authorizer:
            name: cognitoJwt

  finalizeTrip:
    handler: functions/trips/finalize.handler
    events:
      - httpApi:
          path: /trips/{tripId}/finalize
          method: post
          authorizer:
            name: cognitoJwt

  completeTrip:
    handler: functions/trips/complete.handler
    events:
      - httpApi:
          path: /trips/{tripId}/complete
          method: post
          authorizer:
            name: cognitoJwt

  uncompleteTrip:
    handler: functions/trips/uncomplete.handler
    events:
      - httpApi:
          path: /trips/{tripId}/complete
          method: delete
          authorizer:
            name: cognitoJwt

  skipEvent:
    handler: functions/events/skip.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/skip
          method: put
          authorizer:
            name: cognitoJwt

  unskipEvent:
    handler: functions/events/unskip.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/skip
          method: delete
          authorizer:
            name: cognitoJwt

  swapEvent:
    handler: functions/events/swap.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/swap
          method: put
          authorizer:
            name: cognitoJwt

  unswapEvent:
    handler: functions/events/unswap.handler
    events:
      - httpApi:
          path: /trips/{tripId}/events/{eventId}/swap
          method: delete
          authorizer:
            name: cognitoJwt

  upsertMyFeedback:
    handler: functions/feedback/upsert.handler
    events:
      - httpApi:
          path: /trips/{tripId}/feedback/me
          method: put
          authorizer:
            name: cognitoJwt

  leaveTrip:
    handler: functions/members/leave.handler
    events:
      - httpApi:
          path: /trips/{tripId}/members/me
          method: delete
          authorizer:
            name: cognitoJwt

  deleteTrip:
    handler: functions/trips/deleteTrip.handler
    events:
      - httpApi:
          path: /trips/{tripId}
          method: delete
          authorizer:
            name: cognitoJwt

  listNotifications:
    handler: functions/notifications/list.handler
    events:
      - httpApi:
          path: /notifications
          method: get
          authorizer:
            name: cognitoJwt

  markNotificationsRead:
    handler: functions/notifications/markRead.handler
    events:
      - httpApi:
          path: /notifications/mark-read
          method: post
          authorizer:
            name: cognitoJwt

  updateMyDisplayName:
    handler: functions/members/updateDisplayName.handler
    events:
      - httpApi:
          path: /me/displayName
          method: patch
          authorizer:
            name: cognitoJwt

  getMe:
    handler: functions/me/get.handler
    events:
      - httpApi:
          path: /me
          method: get
          authorizer:
            name: cognitoJwt

  updateMyTheme:
    handler: functions/me/updateTheme.handler
    events:
      - httpApi:
          path: /me/theme
          method: patch
          authorizer:
            name: cognitoJwt

  updateMyEmailPrefs:
    handler: functions/me/updateEmailPrefs.handler
    events:
      - httpApi:
          path: /me/email-prefs
          method: patch
          authorizer:
            name: cognitoJwt

  # Remote MCP server — exposes existing handlers as MCP tools by invoking
  # them in-process (see functions/mcp/callHandler.js), so every handler's
  # own guardrails run unchanged. Behind cognitoJwtMcp, not cognitoJwt — see
  # that authorizer's comment above for why they're kept separate.
  mcp:
    handler: functions/mcp/mcpHttp.handler
    timeout: 29
    events:
      - httpApi:
          path: /mcp
          method: post
          authorizer:
            name: cognitoJwtMcp

  # Public, unauthenticated by design (RFC 9728) — an MCP client fetches this
  # *before* it has a token, to discover which authorization server to use.
  mcpWellKnown:
    handler: functions/mcp/wellKnown.handler
    events:
      - httpApi:
          path: /.well-known/oauth-protected-resource
          method: get

  # Deliberately no authorizer — CAN-SPAM requires opt-out to work without a
  # login, and this is the URL every notification/reminder email points at.
  unsubscribe:
    handler: functions/me/unsubscribe.handler
    events:
      - httpApi:
          path: /unsubscribe
          method: get

  # No httpApi event — fires on a schedule, not a request. See
  # REMINDER_WINDOW_DAYS in the handler for why "once a day" tolerates a
  # missed run without ever double-sending or skipping a trip entirely.
  sendTripReminders:
    handler: functions/trips/remindersWorker.handler
    timeout: 60
    events:
      - schedule: rate(1 day)

resources:
  Resources:
    TripPlannerUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: trip-planner-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false

    TripPlannerUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: trip-planner-web-${self:provider.stage}
        UserPoolId: !Ref TripPlannerUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH

    # Hosted UI domain — required for OAuth Authorization Code flow (the MCP
    # client below) and for Cognito to auto-serve /.well-known/openid-
    # configuration + JWKS, which the MCP authorization-server metadata
    # points at. Does not affect the web client, which never used Hosted UI.
    TripPlannerUserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        Domain: !Sub 'trip-planner-${AWS::AccountId}-${self:provider.stage}'
        UserPoolId: !Ref TripPlannerUserPool

    # Separate, additive app client for MCP clients (Claude Desktop, Claude
    # Code, MCP Inspector) — public client (no secret) using Authorization
    # Code + PKCE, distinct from the web client's SRP/password flow. Cognito
    # doesn't support Dynamic Client Registration, so this one fixed client
    # is pre-registered; the target MCP client must support manually
    # configuring an OAuth Client ID rather than requiring DCR.
    #
    # CallbackURLs below is a placeholder for MCP Inspector's documented
    # default local callback — confirm it against the Inspector version you
    # actually run, and add one entry per additional client (Claude Desktop,
    # Claude Code, Claude.ai) as you connect each; Cognito requires at least
    # one non-empty, well-formed URL here to enable OAuth flows at all.
    TripPlannerMcpClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: trip-planner-mcp-${self:provider.stage}
        UserPoolId: !Ref TripPlannerUserPool
        GenerateSecret: false
        AllowedOAuthFlows:
          - code
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthScopes:
          - openid
          - email
        SupportedIdentityProviders:
          - COGNITO
        CallbackURLs:
          - http://localhost:6274/oauth/callback
        ExplicitAuthFlows:
          - ALLOW_REFRESH_TOKEN_AUTH

    TripPlannerTable:
      Type: AWS::DynamoDB::Table
      # DeletionProtectionEnabled means `serverless remove` will fail against
      # this table until it's manually turned off first — that's the point:
      # previously a typo'd stack removal would have destroyed every trip
      # permanently with no recovery path. PITR (continuous backups, ~cents/mo
      # at this data volume) covers the "bad write/bug corrupts data" case
      # deletion protection doesn't.
      DeletionPolicy: Retain
      Properties:
        TableName: trip-planner-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: GSI1pk
            AttributeType: S
          - AttributeName: GSI1sk
            AttributeType: S
          - AttributeName: GSI2pk
            AttributeType: S
          - AttributeName: GSI2sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1pk
                KeyType: HASH
              - AttributeName: GSI1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2pk
                KeyType: HASH
              - AttributeName: GSI2sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Previously nothing watched generateWorker at all — a systemic failure
    # (Bedrock quota exhausted, a bad deploy) would only ever surface as a
    # quiet lastGenerationError on whichever trip happened to hit it, with
    # nobody actually told. This alarms on any Errors in a 5-minute window.
    # FunctionName is built as a plain string (matching the naming convention
    # used elsewhere in this file), not !GetAtt/!Ref to the function resource —
    # this file already hit a circular-dependency deploy failure once from
    # referencing a Lambda's own logical resource from a statement attached
    # to it; this sidesteps that class of bug entirely.
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: trip-planner-${self:provider.stage}-alerts

    # User-confirmed destination (asked directly, not inferred from context).
    # Note: SNS email subscriptions require manual confirmation — AWS will
    # send a "Subscription Confirmation" email after deploy that has to be
    # clicked once before alerts actually deliver.
    AlertTopicSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref AlertTopic
        Protocol: email
        Endpoint: bhvkbhoir95@gmail.com

    GenerateWorkerErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: trip-planner-${self:provider.stage}-generateWorker-errors
        AlarmDescription: Itinerary generation is failing — check CloudWatch Logs for generateWorker.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: trip-planner-api-${self:provider.stage}-generateWorker
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

  Outputs:
    UserPoolId:
      Value: !Ref TripPlannerUserPool
    UserPoolClientId:
      Value: !Ref TripPlannerUserPoolClient
    McpClientId:
      Value: !Ref TripPlannerMcpClient
    McpHostedUiDomain:
      Value: !Sub '${TripPlannerUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
    # HttpApiUrl is intentionally not redefined here — Serverless Framework
    # auto-generates an Output with this exact name for any httpApi event,
    # and a duplicate definition here caused CloudFormation's
    # "Value field ... must evaluate to a String and not a Map" error.

plugins:
  - serverless-offline
